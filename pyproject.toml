[project]
name = "taskbot"
version = "0.1.0"
description = "CLI de tarefas"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.3.0",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
]

[project.scripts]
taskbot = "taskbot.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskbot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
